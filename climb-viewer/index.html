<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Climbing Detection Viewer</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a1a;
            color: #fff;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            margin-bottom: 20px;
            font-weight: 500;
        }

        .file-inputs {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .file-input {
            flex: 1;
            min-width: 250px;
        }

        .file-input label {
            display: block;
            margin-bottom: 8px;
            color: #888;
            font-size: 14px;
        }

        .file-input input {
            width: 100%;
            padding: 10px;
            border: 1px solid #333;
            border-radius: 6px;
            background: #2a2a2a;
            color: #fff;
        }
        .file-input button {
            width: 100%;
            padding: 10px;
            border: 1px solid #333;
            border-radius: 6px;
            background: #2a2a2a;
            color: #fff;
            font: inherit;
            cursor: pointer;
        }
        .file-input button:hover:not(:disabled) {
            background: #333;
            border-color: #555;
        }
        .file-input button:disabled {
            opacity: 0.6;
            cursor: default;
        }

        .video-container {
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 20px;
        }

        video {
            width: 100%;
            display: block;
        }

        .timeline-container {
            background: #2a2a2a;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .timeline-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 14px;
            color: #888;
        }

        .timeline {
            height: 40px;
            background: #3a3a3a;
            border-radius: 4px;
            position: relative;
            cursor: pointer;
            overflow: hidden;
        }

        .segment {
            position: absolute;
            top: 0;
            height: 100%;
            transition: opacity 0.2s;
        }

        .segment.climbing {
            background: linear-gradient(180deg, #4ade80 0%, #22c55e 100%);
        }

        .segment.not-climbing {
            background: #5a5a5a;
        }

        .segment:hover {
            opacity: 0.8;
        }

        .playhead {
            position: absolute;
            top: 0;
            width: 2px;
            height: 100%;
            background: #fff;
            pointer-events: none;
            z-index: 10;
        }

        .current-info {
            background: #2a2a2a;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .current-info h3 {
            font-size: 14px;
            color: #888;
            margin-bottom: 10px;
            font-weight: 500;
        }

        .status {
            display: inline-block;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 18px;
        }

        .status.climbing {
            background: #22c55e;
            color: #000;
        }

        .status.not-climbing {
            background: #444;
            color: #aaa;
        }

        .confidence {
            margin-top: 10px;
            font-size: 14px;
            color: #888;
        }

        .confidence span {
            color: #fff;
            font-weight: 500;
        }

        .segments-list {
            background: #2a2a2a;
            border-radius: 8px;
            padding: 20px;
        }

        .segments-list h3 {
            font-size: 14px;
            color: #888;
            margin-bottom: 15px;
            font-weight: 500;
        }

        .segment-item {
            display: flex;
            align-items: center;
            padding: 10px;
            background: #3a3a3a;
            border-radius: 6px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .segment-item:hover {
            background: #4a4a4a;
        }

        .segment-item.active {
            background: #22c55e33;
            border: 1px solid #22c55e;
        }

        .segment-time {
            font-family: monospace;
            font-size: 14px;
            min-width: 140px;
        }

        .segment-duration {
            color: #888;
            font-size: 13px;
            margin-left: 10px;
        }

        .segment-confidence {
            margin-left: auto;
            font-size: 13px;
            color: #4ade80;
        }

        .summary {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .stat {
            background: #2a2a2a;
            border-radius: 8px;
            padding: 15px 20px;
            flex: 1;
            min-width: 150px;
        }

        .stat-value {
            font-size: 24px;
            font-weight: 600;
        }

        .stat-label {
            font-size: 13px;
            color: #888;
            margin-top: 4px;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #666;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Climbing Detection Viewer</h1>

        <div class="file-inputs">
            <div class="file-input">
                <label>Video File</label>
                <input type="file" id="videoInput" accept="video/*">
            </div>
            <div class="file-input">
                <label>Results JSON</label>
                <input type="file" id="jsonInput" accept=".json">
            </div>
            <div class="file-input">
                <label>Or try it now</label>
                <button type="button" id="sampleBtn">Load sample</button>
            </div>
        </div>

        <div class="video-container">
            <video id="video" controls></video>
        </div>

        <div class="summary" id="summary" style="display: none;">
            <div class="stat">
                <div class="stat-value" id="totalDuration">-</div>
                <div class="stat-label">Total Duration</div>
            </div>
            <div class="stat">
                <div class="stat-value" id="climbingTime">-</div>
                <div class="stat-label">Climbing Time</div>
            </div>
            <div class="stat">
                <div class="stat-value" id="climbingPercent">-</div>
                <div class="stat-label">Climbing %</div>
            </div>
            <div class="stat">
                <div class="stat-value" id="segmentCount">-</div>
                <div class="stat-label">Segments</div>
            </div>
        </div>

        <div class="current-info" id="currentInfo" style="display: none;">
            <h3>Current Status</h3>
            <div class="status" id="currentStatus">-</div>
            <div class="confidence">
                Climbing confidence: <span id="currentConfidence">-</span> |
                Top prediction: <span id="currentPrediction">-</span>
            </div>
        </div>

        <div class="timeline-container" id="timelineContainer" style="display: none;">
            <div class="timeline-header">
                <span id="currentTime">0:00</span>
                <span id="totalTime">0:00</span>
            </div>
            <div class="timeline" id="timeline">
                <div class="playhead" id="playhead"></div>
            </div>
        </div>

        <div class="segments-list" id="segmentsList" style="display: none;">
            <h3>Climbing Segments (click to jump)</h3>
            <div id="segmentsContent"></div>
        </div>
    </div>

    <script>
        let results = null;
        let rawSegments = [];  // Works with both raw_segments (X3D) and frame_data (pose)

        const video = document.getElementById('video');
        const timeline = document.getElementById('timeline');
        const playhead = document.getElementById('playhead');

        // Format time as M:SS
        function formatTime(seconds) {
            const m = Math.floor(seconds / 60);
            const s = Math.floor(seconds % 60);
            return `${m}:${s.toString().padStart(2, '0')}`;
        }

        // Load video file
        document.getElementById('videoInput').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                video.src = URL.createObjectURL(file);
            }
        });

        // Parse a results object (supports both X3D and pose detection formats)
        function loadResults(parsed) {
            results = parsed;

            // Support both formats: raw_segments (X3D) or frame_data (pose)
            if (results.raw_segments) {
                rawSegments = results.raw_segments;
            } else if (results.frame_data) {
                // Convert pose frame_data to segment format
            rawSegments = results.frame_data.map((fr, i, arr) => {
                const nextTime = arr[i + 1]?.time || fr.time + 0.25;

                // Handle new vs old keys
                // New: smoothed_foot_y (processed), foot_y (raw)
                // Old: lowest_foot_y
                let yVal = null;
                if (fr.smoothed_foot_y !== undefined && fr.smoothed_foot_y !== null) yVal = fr.smoothed_foot_y;
                else if (fr.foot_y !== undefined && fr.foot_y !== null) yVal = fr.foot_y;
                else if (fr.lowest_foot_y !== undefined && fr.lowest_foot_y !== null) yVal = fr.lowest_foot_y;

                const isOffGround = !!fr.is_off_ground;

                return {
                    start_time: fr.time,
                    end_time: nextTime,
                    is_climbing: isOffGround,
                    climbing_confidence: (yVal !== null) ? 1 - yVal : 0,
                    top_prediction: fr.pose_detected ? (isOffGround ? "off ground" : "on ground") : "no pose",
                    top_confidence: fr.pose_detected ? 1 : 0,
                };
            });
            } else {
                rawSegments = [];
            }
            renderResults();
        }

        document.getElementById('jsonInput').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (file) loadResults(JSON.parse(await file.text()));
        });

        // Load the bundled sample clip and its detection results
        document.getElementById('sampleBtn').addEventListener('click', async (e) => {
            const btn = e.currentTarget;
            btn.disabled = true;
            btn.textContent = 'Loading\u2026';
            try {
                video.src = 'sample.mp4';
                const res = await fetch('sample.json');
                if (!res.ok) throw new Error('HTTP ' + res.status);
                loadResults(await res.json());
                btn.textContent = 'Sample loaded';
            } catch (err) {
                btn.disabled = false;
                btn.textContent = 'Load sample';
                alert('Could not load the sample: ' + err.message);
            }
        });

        function renderResults() {
            if (!results) return;

            // Show all sections
            document.getElementById('summary').style.display = 'flex';
            document.getElementById('currentInfo').style.display = 'block';
            document.getElementById('timelineContainer').style.display = 'block';
            document.getElementById('segmentsList').style.display = 'block';

            // Update summary stats
            document.getElementById('totalDuration').textContent = formatTime(results.duration);
            document.getElementById('climbingTime').textContent = formatTime(results.total_climbing_time);
            document.getElementById('climbingPercent').textContent =
                Math.round(100 * results.total_climbing_time / results.duration) + '%';
            document.getElementById('segmentCount').textContent = results.climbing_segments.length;
            document.getElementById('totalTime').textContent = formatTime(results.duration);

            // Render timeline segments using climbing_segments (the authoritative source)
            timeline.innerHTML = '<div class="playhead" id="playhead"></div>';

            for (const seg of results.climbing_segments) {
                const div = document.createElement('div');
                div.className = 'segment climbing';
                div.style.left = `${100 * seg.start_time / results.duration}%`;
                div.style.width = `${100 * (seg.end_time - seg.start_time) / results.duration}%`;
                div.title = `${formatTime(seg.start_time)} - ${formatTime(seg.end_time)}`;
                timeline.appendChild(div);
            }

            // Render segments list
            const content = document.getElementById('segmentsContent');
            content.innerHTML = '';

            if (results.climbing_segments.length === 0) {
                content.innerHTML = '<div class="empty-state">No climbing segments detected</div>';
            } else {
                for (const seg of results.climbing_segments) {
                    const div = document.createElement('div');
                    div.className = 'segment-item';

                    // Handle missing confidence (new pose detection doesn't have it on segments)
                    let confHtml = '';
                    if (seg.max_confidence !== undefined) {
                        confHtml = `<span class="segment-confidence">${(100 * seg.max_confidence).toFixed(0)}% conf</span>`;
                    }

                    div.innerHTML = `
                        <span class="segment-time">${formatTime(seg.start_time)} - ${formatTime(seg.end_time)}</span>
                        <span class="segment-duration">${(seg.end_time - seg.start_time).toFixed(1)}s</span>
                        ${confHtml}
                    `;
                    div.addEventListener('click', () => {
                        video.currentTime = seg.start_time;
                        video.play();
                    });
                    content.appendChild(div);
                }
            }
        }

        // Update UI on video time change
        video.addEventListener('timeupdate', () => {
            const time = video.currentTime;
            document.getElementById('currentTime').textContent = formatTime(time);

            // Update playhead
            if (results) {
                const pct = 100 * time / results.duration;
                document.getElementById('playhead').style.left = `${pct}%`;
            }

            // Find current segment
            const seg = rawSegments.find(s => time >= s.start_time && time < s.end_time);
            if (seg) {
                const statusEl = document.getElementById('currentStatus');
                const isClimbing = seg.is_climbing || seg.is_off_ground;
                statusEl.textContent = isClimbing ? 'CLIMBING' : 'NOT CLIMBING';
                statusEl.className = `status ${isClimbing ? 'climbing' : 'not-climbing'}`;

                // Handle both X3D (climbing_confidence) and pose (lowest_foot_y/smoothed_foot_y) formats
                // For pose: yVal was calculated in mapping above
                const confidence = seg.climbing_confidence;

                document.getElementById('currentConfidence').textContent =
                    (100 * confidence).toFixed(1) + '%';
                document.getElementById('currentPrediction').textContent =
                    `${seg.top_prediction} (${(100 * (seg.top_confidence ?? 1)).toFixed(1)}%)`;
            }

            // Highlight active segment in list
            document.querySelectorAll('.segment-item').forEach((el, i) => {
                const s = results.climbing_segments[i];
                el.classList.toggle('active', time >= s.start_time && time < s.end_time);
            });
        });

        // Click timeline to seek
        timeline.addEventListener('click', (e) => {
            if (!results) return;
            const rect = timeline.getBoundingClientRect();
            const pct = (e.clientX - rect.left) / rect.width;
            video.currentTime = pct * results.duration;
        });
    </script>
</body>

</html>
