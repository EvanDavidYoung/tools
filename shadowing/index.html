<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Chinese shadowing — Evan Young</title>
<meta name="description" content="Shadow spoken Mandarin sentence by sentence, with word-level highlighting and an auto-pause drill.">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { font-family: -apple-system, "PingFang TC", "PingFang SC", "Microsoft JhengHei", sans-serif;
         margin: 0; background: #ffffff; color: #202124; }
  header { position: sticky; top: 0; z-index: 10; background: #fff; border-bottom: 1px solid #e5e7eb;
           padding: 10px 16px 0; }
  .hrow { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .hrow h1 { font-size: 17px; margin: 0; font-weight: 600; }
  .seg { display: inline-flex; border: 1px solid #e5e7eb; border-radius: 8px; overflow: hidden; }
  .seg button { border: none; background: #fff; padding: 6px 12px; font-size: 13px; color: #6b7280; cursor: pointer; }
  .seg button.active { background: #202124; color: #fff; }
  .tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; }
  .tab { flex: 0 0 auto; border: 1px solid #e5e7eb; background: #f9fafb; border-radius: 999px;
         padding: 7px 14px; font-size: 13px; color: #374151; cursor: pointer; white-space: nowrap; }
  .tab.active { background: #202124; border-color: #202124; color: #fff; }
  .toolbar { position: sticky; top: var(--hh, 84px); z-index: 9;
             display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 8px 16px;
             border-bottom: 1px solid #e5e7eb; background: #fafafa; font-size: 13px; color: #6b7280; }
  #gapWrap { display: inline-flex; align-items: center; gap: 6px; }
  #gapWrap .lbl { font-size: 12px; color: #9ca3af; }
  #gaps { display: inline-flex; align-items: center; gap: 2px;
          background: #f3f4f6; border-radius: 8px; padding: 3px; }
  #gaps button { border: none; background: none; width: 26px; height: 24px; font-size: 15px; line-height: 1;
                 color: #374151; border-radius: 6px; cursor: pointer; }
  #gaps button:disabled { color: #d1d5db; cursor: default; }
  #gaps button:not(:disabled):active { background: #e5e7eb; }
  #gapVal { min-width: 46px; text-align: center; font-size: 12px; color: #202124;
            font-variant-numeric: tabular-nums; }
  .tbtn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid #e5e7eb;
          background: #fff; border-radius: 999px; padding: 7px 14px;
          font-size: 13px; color: #374151; cursor: pointer; }
  .tbtn svg { width: 15px; height: 15px; }
  .tbtn.on { background: #202124; border-color: #202124; color: #fff; }
  #progress { margin-left: auto; }
  main { max-width: 720px; margin: 0 auto; padding: 20px 20px calc(200px + env(safe-area-inset-bottom)); }
  .sent { font-size: 19px; line-height: 2.0; padding: 14px 16px; margin: 0 0 10px;
          border-radius: 12px; border: 1px solid transparent; cursor: pointer;
          opacity: .5; transition: opacity .25s, background .25s, border-color .25s; }
  .sent.title { font-size: 20px; font-weight: 700; }
  .sent.pstart { margin-top: 26px; }
  .sent.active { opacity: 1; background: #fffbe8; border-color: #ecdfa0; }
  .sent.shadowing { opacity: 1; background: #eafaf0; border-color: #86d6a6; }
  .w { cursor: pointer; border-radius: 4px; padding: 1px 1px; }
  .w:hover { background: #f3f4f6; }
  .w.cur { background: #fef08a; }
  /* bottom player */
  #player { position: fixed; bottom: 0; left: 0; right: 0; background: #fff;
            border-top: 1px solid #e5e7eb; z-index: 20;
            padding: 8px 16px calc(12px + env(safe-area-inset-bottom)); }
  #gapcue { display: none; align-items: center; gap: 10px; margin-bottom: 8px;
            font-size: 12px; color: #1c7a4a; font-variant-numeric: tabular-nums; }
  #gapcue.on { display: flex; }
  #gapText { flex: 0 0 auto; font-weight: 600; }
  #gapBarWrap { flex: 1; height: 6px; background: #e6f4ec; border-radius: 999px; overflow: hidden; }
  #gapBar { height: 100%; width: 100%; background: #34a853; border-radius: 999px; }
  #times { display: flex; align-items: center; gap: 10px; font-size: 12px; color: #6b7280;
           font-variant-numeric: tabular-nums; }
  #scrub { flex: 1; accent-color: #202124; height: 20px; cursor: pointer; }
  #controls { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 6px; }
  .cbtn { width: 44px; height: 44px; border-radius: 50%; border: none; background: #f1f3f4;
          color: #202124; cursor: pointer; display: flex; align-items: center; justify-content: center;
          padding: 0; flex: 0 0 auto; }
  .cbtn:active { background: #e2e5ea; }
  .cbtn svg { width: 20px; height: 20px; display: block; }
  #btnPlay { width: 58px; height: 58px; background: #202124; color: #fff; }
  #btnPlay:active { background: #000; }
  #btnPlay svg { width: 24px; height: 24px; }
  #speeds { display: flex; gap: 2px; background: #f3f4f6; border-radius: 8px; padding: 3px; margin-left: 4px; }
  #speeds button { border: none; background: none; font-size: 12px; color: #6b7280; padding: 5px 8px;
                   border-radius: 6px; cursor: pointer; font-variant-numeric: tabular-nums; }
  #speeds button.active { background: #fff; color: #202124; box-shadow: 0 1px 2px rgba(0,0,0,.1); }
  #hint { margin-left: auto; font-size: 11px; color: #9ca3af; }
  .tab.add { font-weight: 600; }
  #btnDel { margin-left: 4px; color: #b42318; border-color: #f0c8c3; }
  /* add-article panel */
  #addOverlay { position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 40;
                display: none; align-items: center; justify-content: center; padding: 16px; }
  #addOverlay.on { display: flex; }
  #addPanel { background: #fff; border-radius: 14px; width: 100%; max-width: 480px;
              padding: 20px; box-shadow: 0 12px 40px rgba(0,0,0,.2); max-height: 90vh; overflow: auto; }
  #addPanel h2 { margin: 0 0 14px; font-size: 16px; font-weight: 600; }
  #addPanel label { display: block; font-size: 12px; color: #6b7280; margin: 12px 0 4px; }
  #addPanel input, #addPanel textarea {
      width: 100%; border: 1px solid #e5e7eb; border-radius: 8px; padding: 9px 11px;
      font-size: 14px; font-family: inherit; color: #202124; background: #fff; }
  #addPanel textarea { height: 150px; resize: vertical; line-height: 1.7; }
  #addPanel input:focus, #addPanel textarea:focus { outline: 2px solid #202124; outline-offset: -1px; }
  .seg2 { display: inline-flex; border: 1px solid #e5e7eb; border-radius: 8px; overflow: hidden; margin-bottom: 10px; }
  .seg2 button { border: none; background: #fff; padding: 6px 14px; font-size: 13px; color: #6b7280; cursor: pointer; }
  .seg2 button.on { background: #202124; color: #fff; }
  #addPanel .note { font-size: 11px; color: #9ca3af; margin: 10px 0 0; line-height: 1.6; }
  #addProgressWrap { display: none; height: 6px; background: #eef1f4; border-radius: 999px;
                     overflow: hidden; margin-top: 14px; }
  #addProgress { height: 100%; width: 0; background: #202124; transition: width .2s; }
  #addPanel .row { display: flex; align-items: center; gap: 8px; margin-top: 16px; }
  #addStatus { flex: 1; font-size: 12px; color: #6b7280; font-variant-numeric: tabular-nums; }
  #addPanel .row button { border: 1px solid #e5e7eb; background: #fff; border-radius: 8px;
                          padding: 8px 16px; font-size: 13px; cursor: pointer; color: #374151; }
  #addPanel .row button.primary { background: #202124; border-color: #202124; color: #fff; }
  #addPanel .row button:disabled { opacity: .5; cursor: default; }
  @media (max-width: 560px){ #hint{ display:none; } .sent{ font-size: 18px; } }
</style>
</head>

<header>

    <h1>跟讀 Shadowing</h1>
    <div class="seg" id="scriptSeg">

    </div>
  </div>
  <div class="tabs" id="tabs"></div>
</header>
<div class="toolbar">
  <button class="tbtn" id="btnLoop"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>單句循環</button>

  <span id="gapWrap"><span class="lbl">停頓</span><span id="gaps"><button id="gapDn" type="button" title="縮短停頓">−</button><span id="gapVal"></span><button id="gapUp" type="button" title="延長停頓">+</button></span></span>
  <button class="tbtn" id="btnDel" style="display:none" title="刪除這篇文章">刪除</button>
  <span id="progress"></span>
</div>
<main id="doc"></main>
<div id="player">
  <div id="gapcue"><span id="gapText">換你說</span><div id="gapBarWrap"><div id="gapBar"></div></div></div>
  <div id="times"><span id="tCur">0:00</span><input type="range" id="scrub" min="0" max="1000" value="0"><span id="tDur">0:00</span></div>
  <div id="controls">
    <button class="cbtn" id="btnReplay" title="重播本句 (R)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg></button>
    <button class="cbtn" id="btnBack" title="後退 5 秒"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><polyline points="3 4 3 9 8 9"/><text x="12" y="16.5" text-anchor="middle" font-size="8.5" fill="currentColor" stroke="none" font-weight="700">5</text></svg></button>
    <button class="cbtn" id="btnPlay" title="播放/暫停"></button>
    <button class="cbtn" id="btnFwd" title="前進 5 秒"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><polyline points="21 4 21 9 16 9"/><text x="12" y="16.5" text-anchor="middle" font-size="8.5" fill="currentColor" stroke="none" font-weight="700">5</text></svg></button>
    <button class="cbtn" id="btnStop" title="停止"><svg viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="1.5" fill="currentColor"/></svg></button>
    <div id="speeds"></div>
    <span id="hint">Space 播放/暫停 · R 重播本句 · L 單句循環 · S 跟讀模式 · ←/→ 5 秒</span>
  </div>
</div>

<div id="addOverlay"><div id="addPanel">
  <h2>新增文章</h2>
  <div class="seg2"><button id="tabPaste" class="on">貼上文字</button><button id="tabUrl">從網址</button></div>
  <textarea id="addText" placeholder="貼上中文文章，空行分段…"></textarea>
  <input id="addUrl" placeholder="https://…" style="display:none">
  <label for="addTitle">標題（選填）</label>
  <input id="addTitle" placeholder="留空就用第一句">
  <label for="addVoice">語音（選填）</label>
  <input id="addVoice" placeholder="留空 = Fish Audio 預設">
  <label for="addKey">OpenRouter API key</label>
  <input id="addKey" type="password" placeholder="sk-or-v1-…" autocomplete="off">
  <p class="note">語音用 Fish Audio S2.1 Pro（免費）逐句生成，金鑰只存在這台瀏覽器裡。網址模式透過 r.jina.ai 擷取正文。</p>
  <div id="addProgressWrap"><div id="addProgress"></div></div>
  <div class="row"><span id="addStatus"></span><button id="addCancel">取消</button><button id="addGo" class="primary">生成語音</button></div>
</div></div>

function isLookup(ev){
  if(ev && (ev.shiftKey||ev.altKey||ev.ctrlKey||ev.metaKey)) return true;
  const sel = window.getSelection();
  return !!(sel && !sel.isCollapsed && String(sel).trim());

function seek(t){ audio.currentTime=clamp(t); }
function findWord(t){
  let lo=0, hi=words.length-1, ans=-1;
  while(lo<=hi){ const m=(lo+hi)>>1;
    if(words[m].s<=t){ ans=m; lo=m+1; } else hi=m-1; }

// jump to the start of the current sentence and play it (one-shot replay)

  if(curW>=0 && words[curW]) words[curW].el.classList.remove('cur');
  curW=i;

    if(curSent>=0){ sentEls[curSent].classList.remove('active'); curSent=-1; }

  words[i].el.classList.add('cur');
  const sn=words[i].sent;
  if(sn!==curSent){

// ---------- custom articles: paste or fetch text, generate audio ----------
// OpenRouter's /audio/speech returns plain mp3 with no alignment data, so we synthesize
// one sentence at a time. That gives exact sentence boundaries (which is what the loop and
// the shadowing drill actually need) and we spread word times inside a sentence by weight.
const KEY_STORE = 'shadowing_openrouter_key';
const TTS_URL   = 'https://openrouter.ai/api/v1/audio/speech';
const TTS_MODEL = 'fish-audio/s2.1-pro-free:free';
const READER    = 'https://r.jina.ai/';        // CORS-friendly article extractor, no key needed
const DB_NAME = 'shadowing-articles', DB_STORE = 'articles';
const MAX_PARALLEL = 4;

let CUSTOM = [];
function allArticles(){ return DATA.concat(CUSTOM); }
function srcFor(i){ return i < DATA.length ? AUDIO_SRC[i] : CUSTOM[i-DATA.length].url; }

// ---------- 简 / 繁 conversion (OpenCC tables, fetched only when you add your own text) ----------
let openccReady = null;
function loadOpenCC(){
  if(openccReady) return openccReady;
  openccReady = new Promise((res,rej)=>{
    if(window.OPENCC) return res(window.OPENCC);
    const el = document.createElement('script');
    el.src = 'opencc.js';
    el.onload  = ()=> window.OPENCC ? res(window.OPENCC) : rej(new Error('轉換表載入失敗'));
    el.onerror = ()=> rej(new Error('轉換表載入失敗'));
    document.head.appendChild(el);
  });
  return openccReady;
}
// each dict line is "source target[ alternative...]"; we take the first target
function buildTrie(dict){
  const root = new Map();
  for(const line of dict.split('|')){
    const sp = line.indexOf(' ');
    if(sp < 1) continue;
    const from = line.slice(0, sp);
    let to = line.slice(sp+1);
    const alt = to.indexOf(' ');
    if(alt >= 0) to = to.slice(0, alt);
    let m = root;
    for(const ch of from){
      const cp = ch.codePointAt(0);
      let nx = m.get(cp);
      if(!nx){ nx = new Map(); m.set(cp, nx); }
      m = nx;
    }
    m.val = to;
  }
  return root;
}
function convertWith(trie, text){
  const cs = [...text];
  let out = '', i = 0;
  while(i < cs.length){
    let m = trie, best = null, bestLen = 0, j = i;
    while(j < cs.length){
      m = m.get(cs[j].codePointAt(0));
      if(!m) break;
      j++;
      if(m.val !== undefined){ best = m.val; bestLen = j - i; }   // longest match wins
    }
    if(best !== null){ out += best; i += bestLen; }
    else { out += cs[i]; i++; }
  }
  return out;
}
const _tries = {}, _keys = {};
function triesFor(dir){
  if(!_tries[dir]) _tries[dir] = window.OPENCC[dir].map(buildTrie);
  return _tries[dir];
}
function convert(text, dir){
  return triesFor(dir).reduce((t, trie)=>convertWith(trie, t), text);
}
// single-character keys of a group are exactly its character dictionary
function charKeys(dir, idx){
  const k = dir+idx;
  if(!_keys[k]){
    const set = new Set();
    for(const line of window.OPENCC[dir][idx].split('|'))
      if(line.indexOf(' ') === 1) set.add(line[0]);
    _keys[k] = set;
  }
  return _keys[k];
}
// characters unique to one script's key set decide which way to convert
function detectScript(text){
  const sK = charKeys('s2t',0), tK = charKeys('t2s',1);
  let simp = 0, trad = 0;
  for(const ch of text){
    const inS = sK.has(ch), inT = tK.has(ch);
    if(inS && !inT) simp++;
    else if(inT && !inS) trad++;
  }
  return trad > simp ? 'trad' : 'simp';
}

// ---------- segmentation ----------
const SEG = (typeof Intl!=='undefined' && Intl.Segmenter) ? new Intl.Segmenter('zh',{granularity:'word'}) : null;
const ENDS = /[。！？!?；;…]/, CLOSERS = /[」』”’"')）\]】]/;

function splitSentences(text){
  const out=[], chars=[...text]; let buf='';
  for(let i=0;i<chars.length;i++){
    buf += chars[i];
    if(ENDS.test(chars[i])){
      while(i+1<chars.length && (CLOSERS.test(chars[i+1])||ENDS.test(chars[i+1]))) buf += chars[++i];
      out.push(buf); buf='';
    }
  }
  if(buf.trim()) out.push(buf);
  return out.map(s=>s.trim()).filter(Boolean);
}
function segWords(s){
  if(!SEG) return [...s];
  const out=[];
  for(const seg of SEG.segment(s)){
    const t = seg.segment;
    if(!t) continue;
    if(!seg.isWordLike && out.length) out[out.length-1] += t;   // punctuation clings to the word before it
    else out.push(t);
  }
  return out.length ? out : [s];
}
// punctuation is mostly a pause, so it carries less of the sentence's duration than a character does
function weigh(tok){
  let w = 0;
  for(const ch of tok) w += /[\p{P}\p{Z}\s]/u.test(ch) ? 0.35 : 1;
  return Math.max(w, 0.35);
}

// ---------- OpenRouter TTS ----------
async function ttsSentence(text, key, voice){
  const body = { model: TTS_MODEL, input: text, response_format: 'mp3' };
  if(voice) body.voice = voice;
  const r = await fetch(TTS_URL, {
    method:'POST',
    headers:{ 'Authorization':'Bearer '+key, 'Content-Type':'application/json' },
    body: JSON.stringify(body)
  });
  if(!r.ok){
    let msg = r.status+' '+r.statusText;
    try{ const j = await r.json(); if(j.error && j.error.message) msg = j.error.message; }catch(e){}
    throw new Error(msg);
  }
  const blob = await r.blob();
  if(!blob.size) throw new Error('empty audio for: '+text.slice(0,12));
  return blob;
}
async function mapLimit(items, limit, fn, onDone){
  const out = new Array(items.length);
  let next = 0, done = 0;
  await Promise.all(Array.from({length: Math.min(limit, items.length)}, async ()=>{
    while(true){
      const i = next++;
      if(i >= items.length) return;
      out[i] = await fn(items[i], i);
      if(onDone) onDone(++done, items.length);
    }
  }));
  return out;
}
// measuring via an <audio> element rather than decodeAudioData: no AudioContext to unlock,
// no full PCM decode held in memory, and it is the duration the player will actually use
function realDuration(url){
  return new Promise(res=>{
    const a = new Audio();
    let done = false;
    const fin = d => { if(!done){ done = true; res(d); } };
    a.preload = 'metadata';
    a.onloadedmetadata = ()=>fin(isFinite(a.duration)? a.duration : 0);
    a.onerror = ()=>fin(0);
    setTimeout(()=>fin(isFinite(a.duration)? a.duration : 0), 8000);   // never hang the whole build on one clip
    a.src = url;
  });
}
async function clipDuration(blob){
  const u = URL.createObjectURL(blob);
  const d = await realDuration(u);
  URL.revokeObjectURL(u);
  return d;
}

// ---------- build one article from raw text ----------
async function buildArticle(title, text, key, voice, onProgress){
  const paras = text.split(/\n\s*\n+/).map(p=>p.replace(/\s*\n\s*/g,'').trim()).filter(Boolean);
  if(!paras.length) throw new Error('沒有文字可以處理');
  const paraSents = paras.map(splitSentences).filter(a=>a.length);
  if(!paraSents.length) throw new Error('沒有找到句子');

  const head = (title||'').trim() || paraSents[0][0].slice(0,24);
  const flat = [head, ...paraSents.flat()];                   // the title is spoken too, like the demo articles
  if(flat.length > 120) throw new Error('文章太長（'+flat.length+' 句），請分段貼上');

  let srcScript = 'simp', canConvert = false;
  try{ await loadOpenCC(); srcScript = detectScript(text); canConvert = true; }
  catch(e){ canConvert = false; }        // no table -> fall back to identical pairs

  onProgress(0, flat.length, '生成語音…');
  const blobs = await mapLimit(flat, MAX_PARALLEL,
    s => ttsSentence(s, key, voice),
    (d,t)=>onProgress(d, t, '生成語音…'));

  onProgress(flat.length, flat.length, '對齊時間軸…');
  const durs = [];
  for(const b of blobs) durs.push(await clipDuration(b));

  const combined = new Blob(blobs, {type:'audio/mpeg'});
  const url = URL.createObjectURL(combined);
  // decoded clip lengths can drift a few ms from what the concatenated file actually plays;
  // scale the boundaries so the last one lands exactly on the real end
  const measured = await realDuration(url);
  const sum = durs.reduce((a,b)=>a+b,0);
  const k = (measured>0 && sum>0) ? measured/sum : 1;

  const bounds = []; let t = 0;
  for(const d of durs){ const s = t; t += d*k; bounds.push([s, t]); }

  // lay the words out inside each sentence, proportional to weight
  let si = 0, gi = 0;
  const toSent = (sentText, sentIdx)=>{
    const [s, e] = bounds[sentIdx];
    const toks = segWords(sentText);
    const ws = toks.map(weigh), total = ws.reduce((a,b)=>a+b,0) || 1;
    const out = []; let cur = s;
    toks.forEach((tok,i)=>{
      const nxt = (i === toks.length-1) ? e : cur + (e-s)*(ws[i]/total);
      // convert per token so the two scripts stay index-aligned even when a phrase changes length
      const other = canConvert ? convert(tok, srcScript==='simp' ? 's2t' : 't2s') : tok;
      const pair = srcScript==='simp' ? [tok, other] : [other, tok];
      out.push([pair[0], pair[1], +cur.toFixed(3), +nxt.toFixed(3), sentIdx]);
      cur = nxt;
    });
    return out;
  };
  const intro = toSent(head, si++);
  const built = paraSents.map(sents => sents.map(s => toSent(s, si++)));
  return { id:'c'+Date.now(), title: head, intro, paras: built, blob: combined, url, custom:true };
}

// ---------- persistence (IndexedDB: blobs are too big for localStorage) ----------
function idb(){
  return new Promise((res,rej)=>{
    const r = indexedDB.open(DB_NAME,1);
    r.onupgradeneeded = ()=>r.result.createObjectStore(DB_STORE,{keyPath:'id'});
    r.onsuccess = ()=>res(r.result);
    r.onerror = ()=>rej(r.error);
  });
}
async function dbTx(mode, fn){
  const db = await idb();
  return new Promise((res,rej)=>{
    const t = db.transaction(DB_STORE, mode), q = fn(t.objectStore(DB_STORE));
    t.oncomplete = ()=>res(q && q.result);
    t.onerror = ()=>rej(t.error);
  });
}
const saveCustom = a => dbTx('readwrite', s=>s.put({id:a.id,title:a.title,intro:a.intro,paras:a.paras,blob:a.blob}));
const delCustom  = id => dbTx('readwrite', s=>s.delete(id));
async function loadCustom(){
  const rows = await dbTx('readonly', s=>s.getAll()) || [];
  return rows.map(r=>({...r, url:URL.createObjectURL(r.blob), custom:true}));
}

// ---------- add-article panel ----------
function openAdd(){
  $('addOverlay').classList.add('on');
  $('addKey').value = localStorage.getItem(KEY_STORE) || '';
  $('addStatus').textContent = '';
  $('addProgress').style.width = '0%';
  setAddBusy(false);
  (($('addText').style.display === 'none') ? $('addUrl') : $('addText')).focus();
}
function closeAdd(){ $('addOverlay').classList.remove('on'); }
function setAddBusy(b){
  $('addGo').disabled = b;
  $('addGo').textContent = b ? '生成中…' : '生成語音';
  $('addProgressWrap').style.display = b ? 'block' : 'none';
}
function pickMode(url){
  $('tabPaste').classList.toggle('on', !url);
  $('tabUrl').classList.toggle('on', url);
  $('addText').style.display = url ? 'none' : '';
  $('addUrl').style.display  = url ? '' : 'none';
}
async function fetchArticle(u){
  const r = await fetch(READER + u, {headers:{'Accept':'text/plain'}});
  if(!r.ok) throw new Error('抓取失敗：'+r.status);
  let t = await r.text();
  t = t.replace(/^Title:\s*(.*)$/m, (m,x)=>{ if(!$('addTitle').value.trim()) $('addTitle').value = x.trim(); return ''; })
       .replace(/^(URL Source|Markdown Content|Published Time|Warning):.*$/gm, '')
       .replace(/!\[[^\]]*\]\([^)]*\)/g, '')            // images
       .replace(/\[([^\]]*)\]\([^)]*\)/g, '$1')          // links -> their text
       .replace(/^[#>*\-\s]+$/gm, '')
       .replace(/^#+\s*/gm, '');
  const zh = (t.match(/[一-鿿]/g)||[]).length;
  if(zh < 20) throw new Error('這個網址裡找不到中文內容');
  return t.trim();
}
async function doAdd(){
  const key = $('addKey').value.trim();
  if(!key){ $('addStatus').textContent = '需要 OpenRouter API key'; return; }
  localStorage.setItem(KEY_STORE, key);
  setAddBusy(true);
  const prog = (d,t,label)=>{
    $('addStatus').textContent = label + ' ' + d + '/' + t;
    $('addProgress').style.width = (t? d/t*100 : 0) + '%';
  };
  try{
    let text;
    if($('addUrl').style.display === 'none'){
      text = $('addText').value.trim();
      if(!text) throw new Error('請先貼上文字');
    } else {
      const u = $('addUrl').value.trim();
      if(!u) throw new Error('請輸入網址');
      $('addStatus').textContent = '抓取文章…';
      text = await fetchArticle(u);
    }
    const art = await buildArticle($('addTitle').value, text, key, $('addVoice').value.trim(), prog);
    await saveCustom(art);
    CUSTOM.push(art);
    closeAdd();
    $('addText').value = ''; $('addUrl').value = ''; $('addTitle').value = '';
    loadArticle(allArticles().length-1, 0);
  }catch(e){
    $('addStatus').textContent = '⚠︎ ' + (e.message || e);
    $('addProgress').style.width = '0%';
  }
  setAddBusy(false);
}
async function removeCurrent(){
  if(ai < DATA.length) return;
  const a = CUSTOM[ai-DATA.length];
  if(!confirm('刪除「'+a.title+'」？')) return;
  await delCustom(a.id);
  URL.revokeObjectURL(a.url);
  CUSTOM.splice(ai-DATA.length,1);
  loadArticle(0,0);
}
$('tabPaste').onclick = ()=>pickMode(false);
$('tabUrl').onclick   = ()=>pickMode(true);
$('addCancel').onclick = closeAdd;
$('addGo').onclick = doAdd;
$('addOverlay').onclick = e=>{ if(e.target === $('addOverlay')) closeAdd(); };
$('btnDel').onclick = removeCurrent;

(function init(){
  const st = loadState();
  if(st){
    if(st.script==='simp'||st.script==='trad') script = st.script;
    if(typeof st.speed==='number') curSpeed = st.speed;
    if(typeof st.gapSecs==='number') gapSecs = Math.min(GAP_MAX, Math.max(GAP_MIN, st.gapSecs));
    loop = !!st.loop; shadow = !!st.shadow;
  }
  document.documentElement.lang = script==='trad' ? 'zh-Hant' : 'zh-Hans';
  [...$('scriptSeg').children].forEach(x=>x.classList.toggle('active', x.dataset.s===script));
  $('btnLoop').classList.toggle('on', loop);
  $('btnShadow').classList.toggle('on', shadow);
  $('gapWrap').style.display = shadow? '' : 'none';
  renderSpeeds(); renderGaps(); setPlayIcon();
  const i = st && Number.isInteger(st.ai) && st.ai>=0 && st.ai<DATA.length ? st.ai : 0;
  loadArticle(i, st ? (st.t||0) : 0);
  syncPad();
})();

// custom articles live in IndexedDB, so they arrive a tick after the bundled ones
(async function initCustom(){
  try{ CUSTOM = await loadCustom(); }catch(e){ CUSTOM = []; }
  const st = loadState();
  if(CUSTOM.length && st && Number.isInteger(st.ai) && st.ai >= DATA.length && st.ai < allArticles().length)
    loadArticle(st.ai, st.t || 0);
  else renderTabs();
})();
